<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>One More Wine · Logo animation</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F8EFE6}
/* LOGO MONTANDO: cada peça do logo é um <i> recortado (mask) e animado */
.lb{position:relative;width:min(820px,80vw);aspect-ratio:1373/425;color:#83023C;--k:.6}
.lb i{position:absolute;display:block;background:currentColor;-webkit-mask-size:100% 100%;mask-size:100% 100%;opacity:0}
.lb.play i{animation-duration:calc(.75s * var(--k,1));animation-fill-mode:both;animation-timing-function:cubic-bezier(.25,1.45,.45,1)}
.lb.play i[data-g=mais]{animation-name:cai}
.lb.play i[data-g=um]{animation-name:pop}
.lb.play i[data-g=vinho]{animation-name:sobe;animation-timing-function:cubic-bezier(.2,1.25,.4,1)}
.lb.play i[data-g=garrafa]{animation:garrafa calc(1.3s * var(--k,1)) cubic-bezier(.3,1.3,.45,1) both;transform-origin:50% 100%}
@keyframes cai{from{opacity:0;transform:translateY(-70%) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:none}}
@keyframes sobe{from{opacity:0;transform:translateY(55%) scaleY(.6)}to{opacity:1;transform:none}}
@keyframes garrafa{0%{opacity:0;transform:translateY(-120%) rotate(-70deg)}55%{opacity:1;transform:translateY(4%) rotate(8deg)}75%{transform:rotate(-4deg)}90%{transform:rotate(2deg)}100%{opacity:1;transform:none}}

<script>
const lb=document.getElementById('logo');
const CORES=['#83023C','#FF6225','#C5B500','#5C2A54'];
let ci=0, passo=0;
function play(){lb.classList.remove('play');void lb.offsetWidth;lb.classList.add('play')}
function ciclo(){
  if(passo%4===0){lb.style.color=CORES[ci];play()}   // a cada 4 passos: remonta
  else{ci=(ci+1)%CORES.length;lb.style.color=CORES[ci]} // nos outros: só troca a cor
  passo++;
}
ciclo(); setInterval(ciclo,1500);
</script></body></html>
